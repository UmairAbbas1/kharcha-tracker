services:
  - type: web
    name: kharcha-tracker-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: META_TEMPLATE_NAME
        value: budget_alert
